name: Dependabot auto-merge

# Auto-merge policy (README "Dependency Security & Maintenance"):
#
#   AUTO-MERGE (after ALL CI checks pass):
#     - Dependabot PRs updating patch/minor versions of NON-framework packages
#     - development-dependency patch/minor updates
#
#   NEVER auto-merged (human review required):
#     - ANY major-version update
#     - next, react, react-dom (framework — even minor/patch stay manual
#       because they can carry behavior/migration requirements)
#     - PRs with failing or skipped checks
#
# Safety: uses GitHub's native mergeability (branch protection + required
# checks still gate the actual merge). This workflow never bypasses or
# force-merges anything — it only enables auto-merge on PRs that satisfy the
# policy above; GitHub merges only once every required check is green.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for safe updates
        if: |
          steps.metadata.outputs.update-type != 'version-update:semver-major'
          && steps.metadata.outputs.package-name != 'next'
          && steps.metadata.outputs.package-name != 'react'
          && steps.metadata.outputs.package-name != 'react-dom'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave a review note on excluded PRs
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-major'
          || steps.metadata.outputs.package-name == 'next'
          || steps.metadata.outputs.package-name == 'react'
          || steps.metadata.outputs.package-name == 'react-dom'
        run: |
          gh pr comment "$PR_URL" --body \
            "Not eligible for auto-merge (major update or framework package — next/react/react-dom). Human review required."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
