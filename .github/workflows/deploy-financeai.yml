name: Deploy FinanceAI to Production VPS

# Automatic production deployment — gated on the repository's authoritative
# CI workflow ("CI/CD", .github/workflows/ci.yml) completing successfully.
#
# Trigger design:
#   A workflow_run event fires for EVERY completed CI/CD run (success,
#   failure, cancelled, timed out, any branch, any PR). The job-level `if`
#   below admits ONLY:
#       github.event.workflow_run.conclusion == 'success'
#       AND github.event.workflow_run.head_branch == 'main'
#   So: failed/cancelled/timed-out CI, develop, feature branches and pull
#   requests never deploy. Pushes to main alone (without green CI/CD) also
#   never deploy.
#
# Exact-commit design:
#   VERIFIED_SHA = github.event.workflow_run.head_sha — the exact commit CI
#   verified. The VPS is moved to that SHA and verified with
#   `git rev-parse HEAD`, never to "whatever origin/main happens to be".
#
# Safety invariants (enforced in the SSH script):
#   - never `git clean`, never delete untracked files, never touch .env
#   - never `docker compose down -v`, never delete volumes
#   - financeai-db is ensured running/healthy, never recreated
#   - migration runs with the NEW image BEFORE the web service is recreated
#   - production Nginx/HTTPS are never modified
#
# Compose configuration design:
#   Production runs docker-compose.prod.yml ONLY, selected explicitly for
#   every Compose call (validation, migration, build, recreate, health checks
#   and rollback) through the script's single dc() wrapper, together with
#   --env-file. docker-compose.yml is the LOCAL DEVELOPMENT stack and is
#   never used on the VPS. This removes the previous state where production
#   depended on an uncommitted local edit of a tracked file — the change that
#   blocked deployments on the dirty-working-tree guard.
#
# Required production variables are declared with ${VAR:?message} in
# docker-compose.prod.yml, so a missing or empty secret fails during
# `docker compose config`, before any build, migration or restart. Values are
# never printed.
#
# Working-tree rule:
#   Tracked files are owned by Git — any local modification is a hard failure.
#   Untracked files are owned by the operator — never deleted; only an
#   explicit, narrow allow-list of production-local artefacts is tolerated.
#
# NOTE: workflow_run-triggered workflows are only evaluated when this file
# exists on the default branch (main). Merging development → main activates
# the automation.

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy CI-verified commit to production VPS
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Serialize production deployments; a newer successful deploy waits
      # for the running one instead of cancelling it halfway through.
      group: financeai-production-deploy
      cancel-in-progress: false
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Deployment target summary
        run: |
          echo "Gate workflow : CI/CD (.github/workflows/ci.yml)"
          echo "CI conclusion : ${{ github.event.workflow_run.conclusion }}"
          echo "CI branch     : ${{ github.event.workflow_run.head_branch }}"
          echo "CI-verified SHA (VERIFIED_SHA): $VERIFIED_SHA"

      - name: Verify required deployment secrets are configured
        # VPS_SSH_PORT is optional (defaults to 22 inside the SSH step).
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          missing=0
          for v in VPS_HOST VPS_USER SSH_PRIVATE_KEY VPS_FINGERPRINT; do
            if [ -z "${!v}" ]; then
              echo "::error::Required deployment secret '$v' is not set."
              missing=1
            fi
          done
          exit "$missing"
      - name: Deploy over verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          set -euo pipefail

          # ── Provenance of the commit being deployed ──────────────────
          # VERIFIED_SHA comes from job-level env, set from
          # github.event.workflow_run.head_sha (the exact commit the
          # CI/CD run verified). It is validated here as hex-only so it
          # cannot be interpreted as shell code when it is handed to the
          # remote shell below.
          if [ -z "${VERIFIED_SHA:-}" ] \
            || ! [[ "${VERIFIED_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "::error::VERIFIED_SHA is not a valid 40/64-character hex commit SHA."
            exit 1
          fi
          echo "CI-verified commit to deploy: $VERIFIED_SHA"

          # ── SSH transport setup ─────────────────────────────────────
          # Native OpenSSH client (runner default). The private key is
          # written to the ephemeral runner with 600 permissions and is
          # never echoed; host-key verification is enforced below.
          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/financeai_deploy_key
          chmod 600 ~/.ssh/financeai_deploy_key

          ssh-keyscan -T 10 -p "$PORT" -t ed25519 "$VPS_HOST" \
            2>/dev/null > ~/.ssh/financeai_known_hosts
          ACTUAL=$(ssh-keygen -lf ~/.ssh/financeai_known_hosts -E sha256 | awk '{print $2}')
          if [ "$ACTUAL" != "$VPS_FINGERPRINT" ]; then
            echo "::error::VPS host fingerprint verification failed."
            exit 1
          fi
          echo "VPS host fingerprint verified."

          # ── Remote deployment ───────────────────────────────────────
          # VERIFIED_SHA is passed through `env` on the remote command
          # line; it is hex-only by the check above, so it carries no
          # shell metacharacters. The remote script itself is delivered
          # verbatim on stdin by a quoted heredoc (no local expansion).
          # BatchMode=yes prevents a password-prompt hang; the remote
          # script's exit status propagates back to this step.
          ssh -i ~/.ssh/financeai_deploy_key \
            -p "$PORT" \
            -o UserKnownHostsFile=~/.ssh/financeai_known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" \
            "env VERIFIED_SHA='$VERIFIED_SHA' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          # ============================================================
          # FinanceAI production deploy — executes ON the VPS.
          # Strict failure mode (`set -euo pipefail`): any failing
          # command aborts the deployment, and the non-zero exit
          # status propagates back through the SSH transport to
          # fail the workflow step.
          #
          # NEVER: git clean, delete untracked files, touch .env,
          #        `docker compose down -v`, delete volumes,
          #        modify Nginx/HTTPS, recreate financeai-db.
          # ============================================================

          APP_DIR=/home/deployer/Ai-Finance
          PROD_URL=https://financeai-ai.duckdns.org
          VERIFY_LOG=/tmp/financeai-verify.log

          # ── Deployment configuration (single source of truth) ─────────
          # Production configuration is tracked in Git. If the architecture
          # ever changes to a base file plus an override, the dc() wrapper
          # below is the ONLY thing that has to change.
          DEPLOY_BRANCH=main
          COMPOSE_FILE=docker-compose.prod.yml
          ENV_FILE="${FINANCEAI_ENV_FILE:-.env}"
          LOCK_FILE=/tmp/financeai-deploy.lock
          LOCK_WAIT_SECONDS=600
          MIN_FREE_MIB=2048

          # Production-local, non-Git artefacts that are tolerated so a preserved
          # artefact cannot block deployments forever. Anything else untracked is a
          # hard failure. This list is never deleted or modified by the script.
          ALLOWED_UNTRACKED="docker-compose.yml.backup"

          # Every Compose invocation goes through this wrapper, so the production
          # file is selected identically for validation, migration, build, recreate,
          # health checks and rollback. The development file (docker-compose.yml) is
          # never used on this host.
          dc() {
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" "$@"
          }

          echo "=============================================================="
          echo " FinanceAI production deploy"
          echo " CI-verified SHA (VERIFIED_SHA): $VERIFIED_SHA"
          echo " Compose file                  : $COMPOSE_FILE"
          echo " Env file                      : $ENV_FILE"
          echo "=============================================================="

          cd "$APP_DIR"

          # ============================================================
          # >>> [1/8] Pre-flight — lock, host, repository, configuration
          # ============================================================
          echo ">>> [1/8] Pre-flight"

          # ── Deployment lock ────────────────────────────────────────────
          # Complements the workflow concurrency group: two operators (or a
          # manual SSH session and the workflow) can never mutate the working
          # tree or recreate the same containers at the same time. flock(1) is
          # advisory and tied to the file descriptor, so the lock is released
          # automatically if a run is cancelled or the SSH connection drops —
          # it can never become permanently stale.
          echo "--- deploy lock ---"
          exec 9>>"$LOCK_FILE"
          if command -v flock >/dev/null 2>&1; then
            if ! flock -w "$LOCK_WAIT_SECONDS" 9; then
              echo "FATAL: another deployment holds $LOCK_FILE (waited ${LOCK_WAIT_SECONDS}s)."
              echo "Refusing to touch the working tree or any container."
              exit 1
            fi
            echo "Deploy lock acquired (auto-released when this process exits)."
          else
            echo "WARNING: flock(1) unavailable — relying on the workflow concurrency group only."
          fi

          # ── Host prerequisites ─────────────────────────────────────────
          echo "--- docker daemon ---"
          if ! docker info >/dev/null 2>&1; then
            echo "FATAL: Docker daemon is not reachable."
            exit 1
          fi
          echo "Docker daemon reachable."

          echo "--- disk space ---"
          DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)"
          FREE_MIB="$(df -Pm "$DOCKER_ROOT" 2>/dev/null | awk 'NR==2 {print $4}' || true)"
          if [[ "$FREE_MIB" =~ ^[0-9]+$ ]]; then
            if [ "$FREE_MIB" -lt "$MIN_FREE_MIB" ]; then
              echo "FATAL: only ${FREE_MIB} MiB free on $DOCKER_ROOT (need >= ${MIN_FREE_MIB} MiB to build)."
              exit 1
            fi
            echo "Free space on $DOCKER_ROOT: ${FREE_MIB} MiB"
          else
            echo "NOTE: could not determine free space on $DOCKER_ROOT; continuing."
          fi

          # ── Repository state ───────────────────────────────────────────
          echo "--- git: fetch origin/$DEPLOY_BRANCH ---"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"

          # RULE (deliberate, replaces the blanket `git status --porcelain` test):
          #   * Tracked files are owned by Git. Any local modification to a tracked
          #     file is a HARD FAILURE — production configuration is no longer a
          #     local edit, it is docker-compose.prod.yml, which is tracked.
          #   * Untracked files are owned by the operator. Nothing is ever deleted.
          #     Only the explicit ALLOWED_UNTRACKED artefacts are tolerated; every
          #     other untracked file is a HARD FAILURE.
          echo "--- git: tracked files must be pristine ---"
          TRACKED_DIRTY="$(git diff --name-only HEAD)"
          if [ -n "$TRACKED_DIRTY" ]; then
            echo "FATAL: tracked files differ from $DEPLOY_BRANCH — refusing to deploy."
            echo "$TRACKED_DIRTY"
            echo "Production configuration is tracked in $COMPOSE_FILE."
            echo "To discard a local edit on this host (inspect it first):"
            echo "    git -C $APP_DIR diff -- <file>       # inspect"
            echo "    git -C $APP_DIR checkout -- <file>   # discard"
            echo "Nothing has been changed by this deployment."
            exit 1
          fi
          echo "All tracked files match $DEPLOY_BRANCH."

          echo "--- git: untracked files ---"
          UNTRACKED="$(git ls-files --others --exclude-standard)"
          UNEXPECTED=""
          while IFS= read -r f; do
            if [ -z "$f" ]; then
              continue
            fi
            if [[ " $ALLOWED_UNTRACKED " == *" $f "* ]]; then
              echo "NOTE: tolerated production-local artefact: $f (never modified, never deleted)"
            else
              UNEXPECTED="${UNEXPECTED}${f}
          "
            fi
          done <<EOF
          $UNTRACKED
          EOF
          if [ -n "$UNEXPECTED" ]; then
            echo "FATAL: unexpected untracked file(s) — refusing to deploy."
            printf '%s' "$UNEXPECTED"
            echo "(untracked files are NEVER auto-deleted; move or remove them yourself)"
            exit 1
          fi

          echo "--- git: target commit reachability ---"
          if ! git merge-base --is-ancestor "$VERIFIED_SHA" "origin/$DEPLOY_BRANCH"; then
            echo "FATAL: VERIFIED_SHA $VERIFIED_SHA is no longer reachable from origin/$DEPLOY_BRANCH"
            echo "(force-push or history rewrite) — failing safely, deploying nothing."
            exit 1
          fi
          echo "VERIFIED_SHA is reachable from origin/$DEPLOY_BRANCH."

          # The local branch was 7 commits behind origin/main at the time of the
          # incident; `reset --hard` is what advances it, so being behind is safe.
          # A DIVERGED or force-pushed local main is caught by the dirty/reachability
          # checks above before this point.
          git reset --hard "$VERIFIED_SHA"
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$VERIFIED_SHA" ]; then
            echo "FATAL: VPS HEAD ($ACTUAL) != VERIFIED_SHA ($VERIFIED_SHA)"
            exit 1
          fi
          echo "VPS HEAD verified: $ACTUAL"

          # ── Production configuration validation ────────────────────────
          echo "--- production compose file ---"
          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "FATAL: $COMPOSE_FILE is not present in the deployed commit."
            echo "The deploy script and the repository are out of sync; deploying nothing."
            exit 1
          fi
          echo "Compose file present: $COMPOSE_FILE"

          echo "--- production env file ---"
          if [ ! -r "$ENV_FILE" ]; then
            echo "FATAL: env file '$ENV_FILE' is missing or unreadable in $APP_DIR."
            echo "It holds production secrets, is git-ignored, and is never created by"
            echo "this script. Deployment stopped before any build, migration or restart."
            exit 1
          fi
          if [ ! -s "$ENV_FILE" ]; then
            echo "FATAL: env file '$ENV_FILE' is empty."
            exit 1
          fi
          ENV_MODE="$(stat -c '%a' "$ENV_FILE" 2>/dev/null || echo unknown)"
          echo "Env file present (mode $ENV_MODE; contents are never logged)."
          case "$ENV_MODE" in
            400 | 600) : ;;
            *) echo "WARNING: $ENV_FILE mode is $ENV_MODE but it holds production secrets. Consider: chmod 600 $ENV_FILE" ;;
          esac

          # `--quiet` validates syntax and interpolation without printing the resolved
          # configuration. Required variables use ${VAR:?message} in $COMPOSE_FILE, so a
          # missing or empty secret aborts HERE — before a build, a migration or a
          # container recreation. Compose names the variable; it never prints a value.
          echo "--- compose config validation ---"
          if ! CFG_ERR="$(dc config --quiet 2>&1)"; then
            echo "FATAL: invalid production Compose configuration."
            printf '%s\n' "$CFG_ERR" | sed -n '1,20p'
            echo "(Compose reports the NAME of any missing variable, never its value)"
            exit 1
          fi
          echo "Compose configuration is valid."

          # Static guards, analysed directly on the source file. These do not depend on
          # any Compose version's output format, so they cannot drift into false
          # failures. PostgreSQL must never gain a published host port in production.
          echo "--- compose topology assertions (source) ---"
          if awk '/^  financeai-db:[[:space:]]*$/ { f=1; next }
                     f && /^  [^[:space:]]/        { f=0 }
                     f && /^[[:space:]]+ports:/    { found=1 }
                     END { exit found ? 0 : 1 }' "$COMPOSE_FILE"; then
            echo "FATAL: $COMPOSE_FILE publishes a host port for financeai-db."
            echo "PostgreSQL must stay reachable only from inside the 'financeai' network."
            exit 1
          fi
          echo "  financeai-db publishes no host port (private)."
          for svc in financeai-db financeai-web; do
            if ! grep -qE "^  ${svc}:[[:space:]]*$" "$COMPOSE_FILE"; then
              echo "FATAL: $COMPOSE_FILE does not define service '$svc'."
              exit 1
            fi
          done
          echo "  both production services are defined."

          # Deep assertions on the RESOLVED configuration. `docker compose config`
          # changes its output shape between versions (short vs long port/volume
          # syntax), so anything this check cannot interpret is reported as a warning
          # rather than blocking a deploy. Only unambiguous safety violations abort.
          echo "--- compose topology assertions (resolved) ---"
          if command -v python3 >/dev/null 2>&1; then
            if dc config --format json | python3 -c '
          import json, sys

          c = json.load(sys.stdin)
          s = c.get("services", {})
          hard, soft, unknown = [], [], []


          def ports_of(svc):
              """Return [(host_ip, target)] or None if the shape is unrecognised."""
              out = []
              for e in svc.get("ports") or []:
                  if isinstance(e, str):
                      parts = e.split(":")
                      host = parts[0] if len(parts) == 3 else ""
                      out.append((host, parts[-1]))
                  elif isinstance(e, dict) and e.get("target") is not None:
                      out.append((e.get("host_ip") or "", str(e["target"])))
                  else:
                      return None
              return out


          def mounts_of(svc):
              out = []
              for v in svc.get("volumes") or []:
                  if isinstance(v, str):
                      src, _, tgt = v.partition(":")
                      out.append((src.strip(), tgt.strip()))
                  elif isinstance(v, dict) and v.get("target"):
                      out.append((str(v.get("source") or ""), str(v["target"])))
                  else:
                      return None
              return out


          def nets_of(svc):
              n = svc.get("networks")
              if n is None:
                  return []
              if isinstance(n, list):
                  return [str(x) for x in n]
              if isinstance(n, dict):
                  return [str(x) for x in n]
              return None


          names = sorted(s)
          if names != ["financeai-db", "financeai-web"]:
              hard.append("service set is %s, expected [financeai-db, financeai-web]" % names)

          db = s.get("financeai-db", {})
          web = s.get("financeai-web", {})

          db_ports = ports_of(db)
          if db_ports is None:
              unknown.append("cannot interpret financeai-db ports format")
          elif db_ports:
              hard.append("financeai-db publishes host ports: %s" % (db_ports,))

          web_ports = ports_of(web)
          if web_ports is None:
              unknown.append("cannot interpret financeai-web ports format")
          elif web_ports != [("127.0.0.1", "10000")]:
              hard.append("financeai-web publishes %s, expected only [(\"127.0.0.1\", \"10000\")]" % (web_ports,))

          m = mounts_of(db)
          if m is None:
              unknown.append("cannot interpret financeai-db volume format")
          elif not any(src.endswith("financeai_pgdata") and tgt == "/var/lib/postgresql/data" for src, tgt in m):
              soft.append("financeai-db mounts %s, expected financeai_pgdata at /var/lib/postgresql/data" % (m,))

          for name, svc in (("financeai-db", db), ("financeai-web", web)):
              n = nets_of(svc)
              if n is None:
                  unknown.append("cannot interpret %s networks format" % name)
              elif n != ["financeai"]:
                  soft.append("%s is on networks %s, expected [\"financeai\"]" % (name, n))

          if "financeai_pgdata" not in (c.get("volumes") or {}):
              soft.append("named volume financeai_pgdata is not declared at top level")
          if "financeai" not in (c.get("networks") or {}):
              soft.append("network financeai is not declared at top level")
          if web.get("security_opt") != ["no-new-privileges:true"]:
              soft.append("financeai-web security_opt is %s" % (web.get("security_opt"),))

          for m_ in soft:
              print("WARNING: " + m_, file=sys.stderr)
          for m_ in unknown:
              print("NOTE: " + m_, file=sys.stderr)
          for m_ in hard:
              print("ERROR: " + m_, file=sys.stderr)
          sys.exit(1 if hard else 0)
          '; then
              echo "  resolved configuration matches the production topology."
            else
              echo "FATAL: resolved production configuration violates the production topology (see above)."
              exit 1
            fi
          else
            echo "NOTE: python3 unavailable — resolved-configuration assertions skipped."
          fi

          # ── Live stack inventory (read-only) ───────────────────────────
          # Answers, on every run, the questions that caused the incident:
          # which Compose files created the running containers, which project
          # and volume they belong to, and what is actually published.
          echo "--- live container inventory (read-only) ---"
          for c in financeai-db financeai-web; do
            if docker inspect "$c" >/dev/null 2>&1; then
              printf '  %-13s project=%s config_files=%s\n' "$c" \
                "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$c" 2>/dev/null || true)" \
                "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$c" 2>/dev/null || true)"
              printf '  %-13s published_ports=%s\n' "$c" \
                "$(docker inspect -f '{{ json .NetworkSettings.Ports }}' "$c" 2>/dev/null || echo unknown)"
            else
              echo "  $c: not present (first deployment of this service)"
            fi
          done

          # The Compose project name determines the real volume and network names
          # (<project>_financeai_pgdata / _financeai). If the file selection stopped
          # resolving to the same project, Compose would provision EMPTY replacements
          # and the app would start against a blank database. Detect that here.
          echo "--- compose project consistency ---"
          for svc in financeai-db financeai-web; do
            if docker inspect "$svc" >/dev/null 2>&1; then
              RESOLVED_CID="$(dc ps -q "$svc" 2>/dev/null || true)"
              if [ -z "$RESOLVED_CID" ]; then
                echo "FATAL: container '$svc' exists but is NOT in the Compose project resolved from"
                echo "         --env-file $ENV_FILE -f $COMPOSE_FILE"
                echo "  The project/volume/network name would change, so Compose would create"
                echo "  empty replacements and the app would see a blank database."
                echo "  Live project label: $(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$svc" 2>/dev/null || true)"
                echo "  Live data volume:   $(docker inspect -f '{{ range .Mounts }}{{ if eq .Destination "/var/lib/postgresql/data" }}{{ .Name }}{{ end }}{{ end }}' "$svc" 2>/dev/null || true)"
                echo "  Refusing to deploy. Do NOT pass --project-name to silence this without"
                echo "  first confirming which volume holds the production data."
                exit 1
              fi
              echo "  $svc resolves to container ${RESOLVED_CID:0:12}… in the same Compose project."
            fi
          done

          if docker inspect financeai-db >/dev/null 2>&1; then
            DB_VOLUME="$(docker inspect -f '{{ range .Mounts }}{{ if eq .Destination "/var/lib/postgresql/data" }}{{ .Name }}{{ end }}{{ end }}' financeai-db 2>/dev/null || true)"
            if [ -z "$DB_VOLUME" ]; then
              echo "FATAL: financeai-db has no named volume at /var/lib/postgresql/data."
              echo "  The production data location could not be confirmed — deploying nothing."
              exit 1
            fi
            case "$DB_VOLUME" in
              *financeai_pgdata) echo "  PostgreSQL data volume: $DB_VOLUME (never pruned, never removed)" ;;
              *) echo "  WARNING: PostgreSQL data volume is '$DB_VOLUME', expected a name ending in financeai_pgdata." ;;
            esac
          fi

          echo ">>> Pre-flight complete."

          # ── Ensure financeai-db is running and healthy ─────────────────
          echo ">>> [2/8] Ensuring financeai-db is running and healthy"
          DB_CID="$(dc ps -q financeai-db || true)"
          if [ -z "$DB_CID" ] \
            || [ "$(docker inspect -f '{{.State.Status}}' "$DB_CID" 2>/dev/null || echo missing)" != "running" ]; then
            echo "financeai-db not running — starting existing service (data volume untouched)."
            dc up -d financeai-db
            DB_CID="$(dc ps -q financeai-db)"
          fi
          DB_HEALTHY=0
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$DB_CID" 2>/dev/null || echo unknown)" = "healthy" ]; then
              DB_HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$DB_HEALTHY" != "1" ]; then
            echo "FATAL: financeai-db did not become healthy."
            dc ps || true
            exit 1
          fi
          echo "financeai-db healthy."

          # ── Assert financeai-web is the buildable service ──────────────
          # `dc config --images` lists the image of EVERY service, so it can
          # never distinguish "exactly one buildable service" from "one image
          # per service". financeai-db uses a prebuilt postgres image while
          # financeai-web is built from source, so the count is always >= 2.
          # Validate the build configuration of financeai-web directly instead.
          echo "--- financeai-web build configuration ---"
          WEB_BUILD_OK=0
          if command -v jq >/dev/null 2>&1; then
            if dc config --format json \
              | jq -e '.services["financeai-web"].build != null' >/dev/null; then
              WEB_BUILD_OK=1
            fi
          elif command -v python3 >/dev/null 2>&1; then
            if dc config --format json | python3 -c '
          import json, sys
          c = json.load(sys.stdin)
          sys.exit(0 if c.get("services", {}).get("financeai-web", {}).get("build") else 1)
          '; then
              WEB_BUILD_OK=1
            fi
          else
            # No JSON parser: fall back to a static source assertion, which
            # depends on no tool beyond awk and cannot drift with Compose's
            # output format.
            if awk '/^  financeai-web:[[:space:]]*$/ { f=1; next }
                       f && /^  [^[:space:]]/        { f=0 }
                       f && /^[[:space:]]+build:/    { found=1 }
                       END { exit found ? 0 : 1 }' "$COMPOSE_FILE"; then
              WEB_BUILD_OK=1
            fi
          fi
          if [ "$WEB_BUILD_OK" != "1" ]; then
            echo "FATAL: financeai-web is missing its build configuration in $COMPOSE_FILE."
            echo "  Only financeai-web is built from source; financeai-db uses a prebuilt image."
            echo "  Refusing to deploy — the web image could not be rebuilt from this commit."
            exit 1
          fi
          echo "  financeai-web is buildable from this repository."

          # ── Capture previous web image (for app-only rollback) ─────────
          # Both values come from the RUNNING container, never from
          # `dc config`, so the rollback target is exactly the image that is
          # serving now. Not hardcoded: the reference is read from the live
          # container (e.g. ai-finance-financeai-web).
          WEB_CID="$(dc ps -q financeai-web || true)"
          PREV_IMAGE_ID=""
          WEB_IMAGE_NAME=""
          if [ -n "$WEB_CID" ]; then
            PREV_IMAGE_ID="$(docker inspect -f '{{.Image}}' "$WEB_CID")"
            WEB_IMAGE_NAME="$(docker inspect -f '{{.Config.Image}}' "$WEB_CID")"
            echo "Previous financeai-web image retained for rollback: ${PREV_IMAGE_ID:0:19}…"
          fi
          if [ -n "$PREV_IMAGE_ID" ] && [ -z "$WEB_IMAGE_NAME" ]; then
            echo "FATAL: could not determine the previous financeai-web image reference."
            echo "  A rollback would have no safe target, so nothing will be deployed."
            exit 1
          fi
          echo "Rollback target image name: ${WEB_IMAGE_NAME:-none}"

          # App-only rollback: retag previous image, recreate web only.
          # Never touches PostgreSQL or its volume.
          # NOTE: Drizzle migrations are forward-only; this restores the APPLICATION
          # image, it does not undo schema changes.
          rollback_app() {
            if [ -n "$PREV_IMAGE_ID" ] && [ -n "$WEB_IMAGE_NAME" ]; then
              echo ">>> App-only rollback: restoring previous financeai-web image."
              docker tag "$PREV_IMAGE_ID" "$WEB_IMAGE_NAME"
              # Recreates ONLY financeai-web. financeai-db and its volume are
              # never referenced here, so PostgreSQL is untouched.
              dc up -d --force-recreate financeai-web || true
            else
              echo "No previous financeai-web image captured — nothing to roll back."
            fi
          }

          # ── Build the verified image ───────────────────────────────────
          echo ">>> [3/8] Building financeai-web from commit $ACTUAL"
          dc build financeai-web

          # ── Migrate with the NEW image BEFORE recreating web ───────────
          echo ">>> [4/8] Running Drizzle migrations (new image → financeai-db)"
          dc run --rm --no-deps financeai-web npx drizzle-kit migrate
          echo "Drizzle migrations applied."

          # ── PostgreSQL verification gate ───────────────────────────────
          # scripts/verify-postgres.ts is production-safe: it writes only
          # synthetic rows tagged verify-*@example.com, removes them at
          # the end (and on failure, via finally), never logs secrets,
          # and exits non-zero on any failed check.
          echo ">>> [5/8] Running PostgreSQL verification suite (14 checks)"
          if ! dc run --rm --no-deps financeai-web npm run verify:postgres > "$VERIFY_LOG" 2>&1; then
            echo "FATAL: PostgreSQL verification failed. Last 40 lines of output:"
            tail -n 40 "$VERIFY_LOG"
            exit 1
          fi
          if ! grep -q '^Result: 14 passed, 0 failed' "$VERIFY_LOG"; then
            echo "FATAL: verification did not report 'Result: 14 passed, 0 failed'."
            tail -n 40 "$VERIFY_LOG"
            exit 1
          fi
          echo "PostgreSQL verification: 14 passed, 0 failed ✓"
          tail -n 3 "$VERIFY_LOG"

          # ── Recreate ONLY the web service ──────────────────────────────
          echo ">>> [6/8] Recreating financeai-web (financeai-db and volumes untouched)"
          dc up -d --force-recreate financeai-web

          WEB_OK=0
          for i in $(seq 1 60); do
            WEB_CID="$(dc ps -q financeai-web || true)"
            if [ -n "$WEB_CID" ] \
              && [ "$(docker inspect -f '{{.State.Status}}' "$WEB_CID" 2>/dev/null || echo missing)" = "running" ]; then
              WEB_OK=1
              break
            fi
            sleep 2
          done
          if [ "$WEB_OK" != "1" ]; then
            echo "FATAL: financeai-web did not reach running state."
            dc ps || true
            if [ -n "${WEB_CID:-}" ]; then
              echo "--- recent financeai-web logs ---"
              docker logs --tail 100 "$WEB_CID" || true
            fi
            rollback_app || true
            exit 1
          fi

          echo ">>> Container status:"
          dc ps

          # ── Smoke tests ────────────────────────────────────────────────
          echo ">>> [7/8] Smoke tests"

          echo "--- local HTTP (127.0.0.1:10000) ---"
          if ! curl --fail --silent --show-error --max-time 15 http://127.0.0.1:10000/ > /dev/null; then
            echo "FATAL: local HTTP smoke failed."
            if [ -n "${WEB_CID:-}" ]; then docker logs --tail 100 "$WEB_CID" || true; fi
            rollback_app || true
            exit 1
          fi
          echo "Local HTTP: OK"

          echo "--- public HTTPS ($PROD_URL) ---"
          if ! curl --fail --silent --show-error --max-time 15 "$PROD_URL/" > /dev/null; then
            echo "FATAL: public HTTPS smoke failed."
            rollback_app || true
            exit 1
          fi
          echo "Public HTTPS: OK"

          echo "--- auth providers ($PROD_URL/api/auth/providers) ---"
          PROVIDERS="$(curl --fail --silent --show-error --max-time 15 "$PROD_URL/api/auth/providers")"
          echo "$PROVIDERS"
          case "$PROVIDERS" in
            *google*) : ;;
            *) echo "FATAL: 'google' provider missing from /api/auth/providers"
               rollback_app || true
               exit 1 ;;
          esac
          case "$PROVIDERS" in
            *github*) : ;;
            *) echo "FATAL: 'github' provider missing from /api/auth/providers"
               rollback_app || true
               exit 1 ;;
          esac
          echo "Auth providers: OK (google + github present)"

          echo "--- auth session endpoint (no login required) ---"
          SESSION="$(curl --fail --silent --show-error --max-time 15 "$PROD_URL/api/auth/session")"
          echo "Session endpoint responded: $SESSION"

          # ── Targeted fatal-pattern log scan ────────────────────────────
          # Intentionally narrow: DB/Postgres connection failures, boot
          # exceptions, unhandled fatal errors, NextAuth config errors.
          # Rate-limit traffic and harmless warnings do NOT match.
          echo "--- scanning financeai-web logs for fatal patterns (last 10m) ---"
          FATAL_LOG="$(docker logs --since 10m "$WEB_CID" 2>&1 \
            | grep -iE 'ECONNREFUSED|ETIMEDOUT|ENOTFOUND|password authentication failed|relation .* does not exist|EADDRINUSE|unhandled|Cannot find module|\[next-auth\]\[error\]|FATAL' \
            || true)"
          if [ -n "$FATAL_LOG" ]; then
            echo "FATAL: unexpected error patterns found in financeai-web logs:"
            echo "$FATAL_LOG"
            rollback_app || true
            exit 1
          fi
          echo "Log scan: no fatal patterns detected."

          # ── Cleanup (success only; images only, NEVER volumes) ─────────
          echo ">>> [8/8] Pruning dangling images (volumes untouched)"
          docker image prune -f

          echo "=============================================================="
          echo " DEPLOY SUCCESS: $VERIFIED_SHA is live and production smoke tests passed."
          echo "   CI-verified SHA : $VERIFIED_SHA"
          echo "   VPS actual SHA  : $ACTUAL"
          echo "   Compose file    : $COMPOSE_FILE"
          echo "   Migration       : drizzle-kit migrate OK"
          echo "   Postgres verify : 14 passed, 0 failed"
          echo "   Local smoke     : OK"
          echo "   Public HTTPS    : OK"
          echo "   Auth providers  : OK (google + github)"
          echo "=============================================================="
          REMOTE_SCRIPT
