# ==============================================================================
# FinanceAI — PRODUCTION Docker Compose (standalone; not an override)
# ==============================================================================
# This file is the single source of truth for the production stack on the VPS
# (/home/deployer/Ai-Finance). It is intentionally STANDALONE rather than an
# overlay on docker-compose.yml:
#
#   * `docker-compose.yml` is the LOCAL DEVELOPMENT stack (hardcoded dev
#     credentials, PostgreSQL published on 127.0.0.1:5432 for psql/drizzle-kit,
#     web service commented out).
#   * Merging it with an override would UNION those dev-only keys into
#     production — most importantly it would re-publish PostgreSQL on
#     127.0.0.1:5432 and re-add POSTGRES_HOST_AUTH_METHOD, neither of which is
#     part of the running production topology. Clearing an inherited list with
#     Compose's `!reset` tag requires Compose >= v2.24, which cannot be assumed
#     on an unattended production host.
#   * So: production uses exactly ONE file, and no production behaviour depends
#     on an uncommitted modification to a tracked file.
#
# USAGE (production only):
#   docker compose --env-file .env -f docker-compose.prod.yml <command>
# The deploy workflow (.github/workflows/deploy-financeai.yml) always passes
# these two flags. Never run `docker compose up` on this host without them.
#
# ── Values ────────────────────────────────────────────────────────────────────
# Every `${VAR}` is interpolated from the env file supplied by `--env-file`
# (`.env` on the VPS). `.env` holds PRODUCTION SECRETS and is git-ignored; it is
# never committed, never logged, and never modified by the deploy script.
#
# Two interpolation forms are used deliberately:
#
#   ${VAR:?message}   REQUIRED. Compose aborts with `message` if the variable is
#                     unset OR empty. This is the guard that stops a missing
#                     secret from silently becoming an empty string in the
#                     container — it fires during `docker compose config`,
#                     i.e. before any build, migration or container recreation.
#   ${VAR}            OPTIONAL. Interpolates to an empty string when unset,
#                     which is exactly how the running production stack already
#                     behaves (lib/env.ts treats empty as "provider disabled").
#
# Keep this list in sync with .env.example and with lib/env.ts.
#
# ── Topology that MUST NOT change ─────────────────────────────────────────────
# These names are load-bearing. Nginx, the deploy script, the health checks and
# the already-created Docker objects all depend on them:
#
#   Compose project : derived from the directory name ("Ai-Finance" -> the
#                     `ai-finance` project). DO NOT pass `--project-name`: the
#                     volume and network below are prefixed with it, so renaming
#                     the project would make Compose provision EMPTY
#                     replacements and the app would start against a blank
#                     database.
#   Container names : financeai-db, financeai-web  (explicit container_name)
#   Volume          : financeai_pgdata  -> real name ai-finance_financeai_pgdata
#   Network         : financeai         -> real name ai-finance_financeai
#   Web port        : 127.0.0.1:10000   -> the only interface Nginx proxies to
#   Database port   : NOT PUBLISHED AT ALL. Reachable only from inside the
#                     `financeai` network by the service name `financeai-db`.
# ==============================================================================

services:
  financeai-db:
    image: postgres:16-alpine
    container_name: financeai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in the production env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the production env file}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in the production env file}
    # NOTE: no `ports:` — deliberately. PostgreSQL is not published on any host
    # interface in production; only `financeai-web` reaches it over the
    # `financeai` network. (The development file does publish it on loopback.)
    #
    # NOTE: no POSTGRES_HOST_AUTH_METHOD — deliberately, matching the currently
    # running container. That variable only affects `initdb` on a brand-new data
    # directory; the production volume is already initialised, so adding it
    # would be a config change with no effect. Do not "fix" this for symmetry
    # with docker-compose.yml.
    volumes:
      - financeai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - financeai

  financeai-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeai-web
    restart: unless-stopped
    depends_on:
      financeai-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 10000

      # ── Required ──────────────────────────────────────────────────────────
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in the production env file}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL must be set in the production env file}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in the production env file}
      GITHUB_ID: ${GITHUB_ID:?GITHUB_ID must be set in the production env file}
      GITHUB_SECRET: ${GITHUB_SECRET:?GITHUB_SECRET must be set in the production env file}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set in the production env file}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be set in the production env file}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set in the production env file}

      # ── Optional: AI provider tuning (lib/env.ts applies code defaults) ───
      GROQ_SMART_MODEL: ${GROQ_SMART_MODEL}
      GROQ_FAST_MODEL: ${GROQ_FAST_MODEL}
      GROQ_SMART_TEMPERATURE: ${GROQ_SMART_TEMPERATURE}
      GROQ_FAST_TEMPERATURE: ${GROQ_FAST_TEMPERATURE}
      GROQ_SMART_MAX_TOKENS: ${GROQ_SMART_MAX_TOKENS}
      GROQ_FAST_MAX_TOKENS: ${GROQ_FAST_MAX_TOKENS}
      AI_HISTORY_TOKEN_BUDGET: ${AI_HISTORY_TOKEN_BUDGET}

      # ── Optional: market data / search integrations ──────────────────────
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
      TWELVEDATA_MIN_INTERVAL_MS: ${TWELVEDATA_MIN_INTERVAL_MS}
      EULERPOOL_API_KEY: ${EULERPOOL_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}

      # ── Optional: Reddit sentiment ────────────────────────────────────────
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT}

      # ── Optional: transactional email ─────────────────────────────────────
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}

      # ── Optional: public (non-secret) browser configuration ───────────────
      NEXT_PUBLIC_CONTACT_FORM_API_URL: ${NEXT_PUBLIC_CONTACT_FORM_API_URL}

    # Loopback only: Nginx is the sole external entry point. Never change this
    # to "10000:10000" or "0.0.0.0:10000" — that would expose the app directly.
    ports:
      - "127.0.0.1:10000:10000"
    security_opt:
      - no-new-privileges:true
    networks:
      - financeai

networks:
  financeai:
    driver: bridge

volumes:
  financeai_pgdata:
